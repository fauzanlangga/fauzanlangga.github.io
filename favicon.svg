<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cyber Theme Gradients -->
    <linearGradient id="favCyberDiag" x1="80%" y1="10%" x2="15%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="favCyberStem" x1="45%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="favCyberBar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="favShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="1.6" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Layer 1: Right 't' / 'L' Structure -->
  <path
    d="M 48.5 55.5 L 75.5 55.5"
    stroke="url(#favCyberBar)"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 48.5 19.5 L 48.5 76 Q 48.5 88.5 61 88.5 L 86.5 88.5"
    stroke="url(#favCyberStem)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 2: Foreground Slanted Diagonal Pillar -->
  <g filter="url(#favShadow)">
    <path
      d="M 13.5 88.5 L 48.5 11.5"
      stroke="url(#favCyberDiag)"
      stroke-width="11"
      stroke-linecap="round"
    />
  </g>
</svg>
