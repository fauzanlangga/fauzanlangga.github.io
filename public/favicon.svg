<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cyber Theme Gradients -->
    <linearGradient id="favCyberDiag" x1="25%" y1="85%" x2="70%" y2="25%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="favCyberRight" x1="30%" y1="30%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="2" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Right 't' / 'L' Structure -->
  <path
    d="M 48.5 52 L 64 52"
    stroke="url(#favCyberRight)"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 48.5 35 L 48.5 61 Q 48.5 68.5 56 68.5 L 68.5 68.5"
    stroke="url(#favCyberRight)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Left Slanted Pillar -->
  <g filter="url(#favShadow)">
    <path
      d="M 33 68.5 L 49 32"
      stroke="url(#favCyberDiag)"
      stroke-width="11"
      stroke-linecap="round"
    />
  </g>
</svg>
