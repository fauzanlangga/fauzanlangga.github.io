<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <!-- Cyber Theme Gradient: Cyan to Violet/Indigo -->
    <linearGradient id="cyberDiagonal" x1="20%" y1="90%" x2="70%" y2="20%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="cyberRight" x1="40%" y1="30%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Drop Shadow from Left Pillar onto Right Pillar -->
    <filter id="pillarShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="3" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glow Filter for Cyber Theme -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background - NO square box! -->

  <g id="langgard-emblem">
    <!-- Part 2: Right 't' / 'L' Structure (Vertical, Middle Crossbar, Bottom Foot) -->
    <!-- Middle crossbar -->
    <path
      d="M 49 52 L 63 52"
      fill="none"
      stroke="url(#cyberRight)"
      stroke-width="10.5"
      stroke-linecap="round"
    />

    <!-- Vertical line and bottom curve into foot -->
    <path
      d="M 49 34 L 49 61.5 Q 49 68.5 56 68.5 L 68 68.5"
      fill="none"
      stroke="url(#cyberRight)"
      stroke-width="10.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Part 1: Left Slanted Pillar (Overlapping with shadow) -->
    <g filter="url(#pillarShadow)">
      <path
        d="M 33.5 68.5 L 49 32"
        fill="none"
        stroke="url(#cyberDiagonal)"
        stroke-width="10.5"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
